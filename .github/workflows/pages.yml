name: Publish Career Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Check recruitment sources before publishing
        type: boolean
        default: false
  schedule:
    # 08:30 in Hong Kong and mainland China.
    - cron: '30 0 * * *'

permissions:
  contents: read

concurrency:
  group: career-atlas-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest discover -s tools -p test_recruit_extract.py
      - run: python -X utf8 tools/update_recruitment.py
      - id: snapshot
        name: Save the updated recruitment feed
        run: |
          git add -- data/recruitment-feed.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update recruitment notices'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: refresh
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@v5
